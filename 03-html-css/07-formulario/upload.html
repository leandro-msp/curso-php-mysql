<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 7.3 - Formulário</title>
</head>
<body>
    <!-- Trabalhando com Upload de arquivos -->

    <h2>Upload de Arquivos</h2>
    <!-- o atributo enctype multipart/form-data é obrigatório quando precisa trabalhar com form de envio de arquivos através do elemento input type="file" -->
     <form action="" method="" enctype="multipart/form-data">
        <fieldset> 
            <legend>Upload</legend>
                <input type="file" name="upload"><br><br>

                <input type="submit" value="Enviar Dados">
        
    
        </fieldset>
     </form>
    
</body>
</html>
