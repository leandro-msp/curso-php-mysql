<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 5 CSS - Elementos Flutuantes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <h1>Elementos Flutuantes</h1>

    </div>

    <!-- trabalhando com elementos flutuantes 

     atalhos de digitação -> div.container + enter
                             div.box-*4 + enter
    -->
    <div class="container">
        <div class="box box-1">Esta é a div box 1</div>
        <div class="box box-2">Esta é a div box 2</div>
        <div class="box box-3">Esta é a div box 3</div>
        <div class="box box-4">Esta é a div box 4</div>
        <div class="limpar"></div> <!--elemento utlizado para limpar predefinições a, conforme configurado na classe, ele limpa "sujeira" dos elementos que estiver acima ou abaixo da sua posição-->
    </div>

</body>

</html>
