<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introdução no CSS</title>
    <link rel="stylesheet" href="style.css"> <!--método recomendaado , criar arquivo externo para estilos e chamá-lo através do link-->
    <!-- método não recomendado - Interno 
     <style>
        div{background-color: rgb(134, 169, 245);} <- altera cor de fundo de todo o conteúdo que estiver dentro da div
        h1{background-color: blueviolet} <- altera o fundo de todas as tags h1
     </style>
    --> 
</head>
<body>
    <div>
        <h1>Aula CSS</h1>
        <p>Importando folha de estilos</p>

        <!-- o fundo da div vai predominar todo o conteúdo dentro dela, já o fundo h1 tem sua propriedade e propriedade -->
    </div>
    
</body>
</html>
