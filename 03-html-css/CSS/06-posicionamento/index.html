<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 6 CSS - Posicionamento </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Posicionamento CSS - Positions</h1>
    </div>
    <!-- trablhando com propriedade "positions" , conceitos explicativos em "anotacoes.txt" -->
    <!-- POSITION -->
     <div class="container">
        <!-- POSITION FIXED -->
        <div class="fixo">Posição Fixa</div>
        <div class="divisao"></div>

        <!-- POSITION RELATIVE -->
        <div class="relativo">
            <div class="filho">Posição Relativa</div>
        </div>

        <!-- POSITION ABSOLUTE -->
         <div class="absoluto">
            <div class="filho">Posição Absoluta</div>
         </div>
     </div>

     <div class="full">Full</div>
