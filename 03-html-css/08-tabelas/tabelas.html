<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 8 - Tabelas com HTML</title>
</head>

<body>
    <!-- tabelas no html -->
    <table style="width: 100%; text-align: center; ">
        <!-- cabeçalho da tabela -->
        <thead>
            <tr> <!--linha da tabela-->
                <th>Nome</th> <!--colunas-->
                <th>Idade</th>
                <th>Funçao</th>
                <th>Salário</th>
            </tr>
        </thead>

        <!-- corpo da tabela-->
        <tbody>
            <tr>
                <td>João</td>
                <td>23</td>
                <td>Estagiário</td>
                <td>2000</td>
            </tr>
            <tr>
                <td>Kátia</td>
                <td>35</td>
                <td>Dev-pleno</td>
                <td>7000</td>
            </tr>
            <tr>
                <td>Luiz</td>
                <td>46</td>
                <td>Gerente de Infraestrutura</td>
                <td>17000</td>
            </tr>
            <!-- este é apenas um exemplo da estrutura, apontando o que cada tag representa. Em um sistema não há necessidade, nem é uma boa prática replicar a estrutura e add dados manualmente
            Isso é simplificado e melhorado usando a linguagem de programação integrada com o html, dessa forma só se faz a estrutura uma vez, e o PHP por exemplo, se encarrega
            de adicionar grande número de dados a partir do laço for -->
        </tbody>

        <!-- rodapé da tabela -->
        <tfoot>
            <tr> <!--linha da tabela-->
                <th>Nome</th> <!--colunas-->
                <th>Idade</th>
                <th>Funçao</th>
                <th>Salário</th>
            </tr>

        </tfoot>
    </table>

</body>

</html>

<!--
thead = cabeçalho
tbody =  corpo
tfoot = rodapé
tr = linha
th - colunas
td = table data( onde se coloca as informações)



-->
