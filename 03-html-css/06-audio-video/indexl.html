<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 06 - Tag aúdio e vídeo</title>
</head>
<body>
    <!-- trabalhando com áudio e vídeo -->

    <!-- audio -->
     <h1>Car Town Theme</h1>
    <audio src="Car Town Theme Looped Smoothly(M4A_128K).m4a" controls>

    </audio>
    <br>
    <!-- video -->
    <h1>Clip live:</h1>
    <video src="clip.mp4" width="1280px" controls autoplay></video>
    
    <!-- atributos: 
     
    width = delimita o tamanho vídeo (isso por ser melhor controlado através do CSS)
    controls = habilita os controles de reprodução, por exemplo, play, pause, volume 
    autplay = inicia o video automaticamente

    -->

</body>
</html>
