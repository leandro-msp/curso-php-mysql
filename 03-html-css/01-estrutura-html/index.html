<!DOCTYPE html> <!--Informa a versão do HTML para o interpretador do Browser-->
<html lang="pt-br"> <!--linguagem que está sendo utilizada na aplicação-->
<head> <!--Contém os metadados que serão utilizados pelos motores de busca dos navegadores, e também configurações da página-->
    <meta charset="UTF-8"> <!--informa a cadeira de caractere que aplicação está utilizando. UTF-8 permite o uso de caracteres especiais e acentuações-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--padroniza a aplicação para que seja renderizada corretamente em dispositivos móveis(Smartphones e Tablets)-->
    <title>Aula 1- Desenvolvimento Web</title> <!-- Título que fica visível na aba da página-->
</head>
<body>
    <!-- Dentro da tag body fica todo o conteúdo que será mostrado para o usuário-->
    
</body>
</html>
